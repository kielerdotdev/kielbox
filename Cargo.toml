[workspace]
members = ["crates/*"]
default-members = ["crates/media-core", "crates/media-io", "crates/editor-core", "crates/dpdfnet", "crates/nvenc-sys", "crates/windows-capture", "crates/desktop", "crates/toolkit"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.99"
repository = "https://github.com/kielerdotdev/kielbox"

[workspace.dependencies]
screenshot-app = { path = "crates/screenshot-app" }
screenshot = { path = "crates/screenshot" }
screenshot-portal = { path = "crates/screenshot-portal" }
screenshot-wayland = { path = "crates/screenshot-wayland" }
screenshot-windows = { path = "crates/screenshot-windows" }
screenshot-x11 = { path = "crates/screenshot-x11" }
cli = { path = "crates/cli" }
workflows = { path = "crates/workflows" }
image-editor = { path = "crates/image-editor" }
image-editor-ui = { path = "crates/image-editor-ui" }
image-gpu = { path = "crates/image-gpu" }
hdr = { path = "crates/hdr" }
hotkeys = { path = "crates/hotkeys" }
image-effects = { path = "crates/image-effects" }
ipc = { path = "crates/ipc" }
screenshot-overlay = { path = "crates/screenshot-overlay" }
platform = { path = "crates/platform" }
recording-tools = { path = "crates/recording-tools" }
toolkit-services = { path = "crates/toolkit-services" }
toolkit-settings-ui = { path = "crates/toolkit-settings-ui" }
shell = { path = "crates/shell" }
image-types = { path = "crates/image-types" }
upload = { path = "crates/upload" }
cloud = { path = "crates/cloud" }
thiserror = "2"
tracing = "0.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif"] }
half = "2"
rayon = "1"

anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
windows = { version = "0.61.3", features = [
    "Foundation", "Graphics_Capture", "Graphics_DirectX_Direct3D11",
    "Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi",
    "Win32_System_Threading", "Win32_System_Performance", "Win32_System_Com", "Win32_System_Com_StructuredStorage",
    "Win32_Security", "Win32_System_Variant", "Win32_Media_Audio", "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Time",
    "Win32_System_DataExchange", "Win32_System_Memory"
] }

[profile.dev]
debug = 1
incremental = false

[profile.dev.package.dpdfnet]
opt-level = 3

[profile.dev.package.rustfft]
opt-level = 3

# The normal development desktop is used for interactive verification. Keep UI
# layout and scene construction optimized without optimizing the entire workspace.
[profile.dev.package.rune]
opt-level = 2
[profile.dev.package.taffy]
opt-level = 2

# Screenshot raster kernels must run at production speed in desktop development builds.
[profile.dev.package.toolkit]
opt-level = 3
[profile.dev.package.image-editor]
opt-level = 3
[profile.dev.package.image-effects]
opt-level = 3
# Screenshot alpha normalization and channel conversion touch every desktop pixel.
[profile.dev.package.image-types]
opt-level = 3
[profile.dev.package.hdr]
opt-level = 3
[profile.dev.package.tiny-skia]
opt-level = 3

# Library thumbnails decode full source pixels before resizing; keep these hot
# kernels optimized in the normal desktop development executable as well.
[profile.dev.package.image]
opt-level = 3
[profile.dev.package."png:0.18.1"]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package."miniz_oxide:0.8.9"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pragmatic pedantic exceptions: image/pixel maths casts constantly and intentionally.
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_lossless = "allow"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
too_many_lines = "allow"
similar_names = "allow"
return_self_not_must_use = "allow"
needless_pass_by_value = "allow"
missing_fields_in_debug = "allow"
struct_excessive_bools = "allow"
many_single_char_names = "allow"
