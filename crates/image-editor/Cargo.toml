[package]
name = "image-editor"
description = "UI-agnostic image editor engine: document model, tools, renderer, interactive session and undo."
version.workspace = true
edition = "2024"
rust-version.workspace = true
license = "GPL-3.0-or-later"
repository.workspace = true
publish = false

[dependencies]
image-types.workspace = true
image-effects = { path = "../image-effects" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
image.workspace = true
rayon.workspace = true
tiny-skia = "0.11"
cosmic-text = { version = "0.14", default-features = false, features = ["std", "swash"] }
base64 = "0.22"

[dev-dependencies]
proptest = "1"

[lints]
workspace = true
