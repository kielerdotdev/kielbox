[package]
name = "rcr-toolkit-services"
description = "Real implementations of the rcr-workflows service traits: capture, uploads, clipboard, notifications, commands, zipping and more."
version.workspace = true
edition = "2024"
rust-version.workspace = true
license = "GPL-3.0-or-later"
repository.workspace = true
publish = false

[features]
default = []
# Native "save as" dialog (`rfd`, through the XDG portal on Linux). Off by default so headless
# builds stay small; the CLI never needs it.
save-dialog = ["dep:rfd"]
# The real screen recorder (`rcr-recording-tools`): region selection on the overlay, audio choice.
# Without `ffmpeg` only GIF recordings work.
record = ["dep:rcr-recording-tools", "rcr-recording-tools/gif", "rcr-recording-tools/audio", "rcr-recording-tools/gpu"]
# MP4/WebM/MKV encoding through the system FFmpeg, linked dynamically (development default).
ffmpeg = ["record", "rcr-recording-tools/system", "rcr-recording-tools/gpl", "rcr-recording-tools/portal"]
# The same encoders through a statically linked FFmpeg you provide (FFMPEG_DIR / vcpkg; see
# crates/rcr-recording-tools/build/README.md). Use with `--no-default-features`: the two linkages are
# alternatives, and enabling both would make the build ambiguous.
ffmpeg-static = ["record", "rcr-recording-tools/static-prebuilt", "rcr-recording-tools/gpl", "rcr-recording-tools/portal"]

[dependencies]
rcr-image-types.workspace = true
rcr-workflows.workspace = true
rcr-screenshot.workspace = true
rcr-hdr.workspace = true
rcr-platform.workspace = true
rcr-upload.workspace = true
rcr-screenshot-overlay = { path = "../rcr-screenshot-overlay" }
rcr-recording-tools = { path = "../rcr-recording-tools", default-features = false, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
toml = "0.9"
tempfile = "3"
url = "2"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros", "net"] }
tokio-util = "0.7"
arboard = { version = "3", default-features = false, features = ["image-data", "wayland-data-control"] }
keyring = "4"
notify-rust = "4"
opener = "0.8"
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }
rfd = { version = "0.17", optional = true, default-features = false, features = ["xdg-portal"] }

[dev-dependencies]
rcr-workflows = { workspace = true, features = ["testing"] }
half.workspace = true
wiremock = "0.6"

[lints]
workspace = true
