[package]
name = "rcr-platform"
description = "Wires the OS capture backends and HDR tone-mapping into one ScreenSource that always returns 8-bit sRGB frames."
version.workspace = true
edition = "2024"
rust-version.workspace = true
license = "GPL-3.0-or-later"
repository.workspace = true
publish = false

[dependencies]
rcr-image-types.workspace = true
rcr-screenshot.workspace = true
rcr-hdr.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
rcr-screenshot-windows.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
rcr-screenshot-wayland.workspace = true
rcr-screenshot-portal.workspace = true
rcr-screenshot-x11.workspace = true

[dev-dependencies]
half.workspace = true

[lints]
workspace = true
