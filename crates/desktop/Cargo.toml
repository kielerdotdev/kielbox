[package]
name = "desktop"
version.workspace = true
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
anyhow.workspace = true
async-channel = "2"
serde_json.workspace = true
serde.workspace = true
tempfile = "3"
sha2 = "0.10"
media-core = { path = "../media-core" }
toolkit = { path = "../toolkit" }
editor-core = { path = "../editor-core" }
image = { version = "0.25", default-features = false }
unicode-segmentation = "1.12"
rune = { git = "https://github.com/anomalyco/rune", rev = "a9da7e3ebf5a8ab9bf19c3015032674b6e042df2", default-features = false, features = ["accessibility", "native-file-dialog", "svg"] }
disk = { path = "../disk" }
screenshot-overlay.workspace = true

[target.'cfg(windows)'.dependencies]
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider", "system-proxy"] }
tokio = { version = "1", features = ["rt", "net", "time"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.6"
semver = "=1.0.28"
raw-window-handle = "0.6"
tray-icon = { version = "0.24", default-features = false }
windows = { workspace = true, features = ["Win32_UI_Shell", "Win32_Storage_FileSystem", "Win32_System_Power", "Win32_System_Diagnostics_ToolHelp"] }
windows-capture = { path = "../windows-capture" }
recording-tools = { path = "../recording-tools", default-features = false, features = ["audio"] }
screenshot.workspace = true
screenshot-windows.workspace = true

[dev-dependencies]
media-io = { path = "../media-io" }

[build-dependencies]
embed-resource = "=3.0.12"
