[package]
name = "rcr-windows"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
serde_json.workspace = true
serde.workspace = true
rcr-media-core = { path = "../media-core" }
rcr-media-io = { path = "../media-io" }
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Devices_Display", "Win32_Devices_FunctionDiscovery", "Win32_UI_Shell_PropertiesSystem"] }
windows-core = "0.61.2"
libloading = "0.8.9"
rcr-nvenc-sys = { path = "../nvenc-sys" }

[target.'cfg(windows)'.dev-dependencies]
windows = { workspace = true, features = ["Win32_System_StationsAndDesktops", "Win32_System_RemoteDesktop"] }

[[bin]]
name = "rcr-capture"
path = "src/main.rs"
