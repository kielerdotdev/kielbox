[package]
name = "rcr-screenshot-x11"
version.workspace = true
edition = "2024"
rust-version.workspace = true
license = "GPL-3.0-or-later"
repository.workspace = true
publish = false

[dependencies]
rcr-image-types.workspace = true
rcr-screenshot.workspace = true

[lints]
workspace = true

[target.'cfg(all(unix, not(target_vendor = "apple")))'.dependencies]
thiserror.workspace = true
tracing.workspace = true
x11rb = { version = "0.14", features = ["shm", "randr", "xfixes", "composite"] }

[target.'cfg(all(unix, not(target_vendor = "apple")))'.dev-dependencies]
x11rb = { version = "0.14", features = ["render", "randr", "composite", "xfixes"] }

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
rustix = { version = "1", features = ["fs"] }
