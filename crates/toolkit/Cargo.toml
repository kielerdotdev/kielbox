[package]
name = "rcr-toolkit"
version.workspace = true
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
ssx-core = { path = "../../vendor/ssx/crates/ssx-core" }
ssx-services = { path = "../../vendor/ssx/crates/ssx-services" }
ssx-editor = { path = "../../vendor/ssx/crates/ssx-editor" }
ssx-types = { path = "../../vendor/ssx/crates/ssx-types" }
ssx-imgfx = { path = "../../vendor/ssx/crates/ssx-imgfx" }
ssx-hdr = { path = "../../vendor/ssx/crates/ssx-hdr" }
tempfile = "3"
toml = "0.9"
rayon = "1"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
crc32fast = "1"
image = { version = "0.25", default-features = false }
rqrr = "0.10"

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Media_Ocr", "Graphics_Imaging", "Storage_Streams", "Globalization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl"] }

[dev-dependencies]
ssx-core = { path = "../../vendor/ssx/crates/ssx-core", features = ["testing"] }
ssx-upload = { path = "../../vendor/ssx/crates/ssx-upload" }
async-trait = "0.1"
tokio = { version = "1", features = ["rt", "macros"] }
url = "2"
