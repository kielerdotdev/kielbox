[package]
name = "rcr-toolkit"
version.workspace = true
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
rcr-workflows = { path = "../rcr-workflows" }
rcr-toolkit-services = { path = "../rcr-toolkit-services" }
rcr-image-editor = { path = "../rcr-image-editor" }
rcr-image-types = { path = "../rcr-image-types" }
rcr-image-effects = { path = "../rcr-image-effects" }
rcr-hdr = { path = "../rcr-hdr" }
tempfile = "3"
toml = "0.9"
rayon = "1"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
crc32fast = "1"
image = { version = "0.25", default-features = false }
rqrr = "0.10"

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Media_Ocr", "Graphics_Imaging", "Storage_Streams", "Globalization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl"] }

[dev-dependencies]
rcr-workflows = { path = "../rcr-workflows", features = ["testing"] }
rcr-upload = { path = "../rcr-upload" }
async-trait = "0.1"
tokio = { version = "1", features = ["rt", "macros"] }
url = "2"
