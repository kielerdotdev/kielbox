[package]
name = "toolkit"
version.workspace = true
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
disk = { path = "../disk" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
workflows = { path = "../workflows" }
toolkit-services = { path = "../toolkit-services" }
image-editor = { path = "../image-editor" }
image-types = { path = "../image-types" }
image-effects = { path = "../image-effects" }
hdr = { path = "../hdr" }
tempfile = "3"
toml = "0.9"
rayon = "1"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
crc32fast = "1"
image = { version = "0.25", default-features = false }
rqrr = "0.10"

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Media_Ocr", "Graphics_Imaging", "Storage_Streams", "Globalization"] }

[dev-dependencies]
workflows = { path = "../workflows", features = ["testing"] }
upload = { path = "../upload" }
async-trait = "0.1"
tokio = { version = "1", features = ["rt", "macros"] }
url = "2"
