name: Windows build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows x64 release
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: |
          rustup show
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain installation failed' }
          rustc --version
          cargo --version

      - name: Configure Windows build
        run: |
          . ./scripts/packaging/Find-fxc.ps1
          $sdkRoots = @(
            "${env:ProgramFiles(x86)}/Windows Kits/10/bin",
            "$env:ProgramFiles/Windows Kits/10/bin"
          )
          $fxc = Find-RcrFxcCompiler -ExplicitPath $env:GPUI_FXC_PATH -PathDirectories ($env:PATH -split ';') -SdkBinRoots $sdkRoots
          "GPUI_FXC_PATH=$fxc" | Add-Content $env:GITHUB_ENV
          # Cargo's encoded format preserves paths containing spaces. Remap both
          # separator forms because rustc's prefix substitution is textual.
          $flags = @(
            '-C', 'target-feature=+crt-static',
            "--remap-path-prefix=$env:USERPROFILE=/build-user",
            "--remap-path-prefix=$($env:USERPROFILE.Replace('\', '/'))=/build-user",
            "--remap-path-prefix=$env:GITHUB_WORKSPACE=/kielbox",
            "--remap-path-prefix=$($env:GITHUB_WORKSPACE.Replace('\', '/'))=/kielbox"
          )
          "CARGO_ENCODED_RUSTFLAGS=$($flags -join [char]31)" | Add-Content $env:GITHUB_ENV

      - name: Restore Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git/db
            target/release
          key: windows-x64-release-v2-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'Cargo.toml', '.cargo/config.toml') }}-${{ github.sha }}
          restore-keys: |
            windows-x64-release-v2-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'Cargo.toml', '.cargo/config.toml') }}-

      - name: Test packaging
        run: ./scripts/test-package-windows.ps1

      - name: Test installer admission
        run: ./scripts/installer/Test-InstallerPackaging.ps1

      - name: Choose Windows package version
        run: |
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read desktop package version' }
          $baseVersion = @($metadata.packages | Where-Object { $_.name -eq 'desktop' })[0].version.Split('+')[0]
          $suffix = "ci.$env:GITHUB_RUN_NUMBER.$env:GITHUB_RUN_ATTEMPT"
          $installerVersion = if ($baseVersion.Contains('-')) { "$baseVersion.$suffix" } else { "$baseVersion-$suffix" }
          "KIELBOX_BUILD_VERSION=$installerVersion" | Add-Content $env:GITHUB_ENV

      - name: Test shared disk tools and cleanup CLI
        run: |
          cargo test --locked --release -p disk -p clean -j1
          if ($LASTEXITCODE -ne 0) { throw 'Disk tool tests failed' }

      - name: Build release executable
        run: |
          cargo build --locked --release -p desktop -p clean -j1
          if ($LASTEXITCODE -ne 0) { throw 'Windows release build failed' }

      - name: Package application
        run: |
          New-Item -ItemType Directory -Force .downloads | Out-Null
          $shortCommit = $env:GITHUB_SHA.Substring(0, 12)
          $sourceArchive = Join-Path $env:GITHUB_WORKSPACE ".downloads/kielbox-source-$shortCommit.zip"
          git archive --format=zip --output=$sourceArchive HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Source archive failed' }
          ./scripts/package-windows.ps1 -SkipBuild -Version "ci-$env:GITHUB_RUN_NUMBER-$shortCommit" -OutputDirectory dist/windows -SourceArchive $sourceArchive

      - name: Check packaged commands
        run: ./scripts/ci/check-windows-package.ps1 -PackageDirectory dist/windows -ReportDirectory .downloads/package-check

      - name: Test native installation, update and uninstall
        run: ./scripts/installer/Test-NativeInstall.ps1 -PackageDirectory dist/windows

      - name: Build Kielbox installer
        run: |
          ./scripts/package-installer-windows.ps1 -PackageDirectory dist/windows -Version $env:KIELBOX_BUILD_VERSION -Channel preview -OutputDirectory dist/windows-installer

      - name: Upload Windows download
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kielbox-windows-x64
          path: dist/windows-installer/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Link download in run summary
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          "### Windows x64 build" | Add-Content $env:GITHUB_STEP_SUMMARY
          '[Install Kielbox — direct EXE download](https://github.com/kielerdotdev/kielbox/releases/download/preview/Kielbox-Setup.exe)' | Add-Content $env:GITHUB_STEP_SUMMARY
          "[Build evidence artifact (ZIP)]($env:ARTIFACT_URL)" | Add-Content $env:GITHUB_STEP_SUMMARY
          "Commit: $env:GITHUB_SHA. Contains the native installer and update catalog. Preview builds are unsigned. The direct download updates after the main-branch publication job succeeds." |
            Add-Content $env:GITHUB_STEP_SUMMARY
          'Run Kielbox-Setup.exe. The wizard offers installation location, optional desktop shortcut and startup. Video editing requires FFmpeg/FFprobe on PATH.' |
            Add-Content $env:GITHUB_STEP_SUMMARY

  publish-preview:
    name: Publish preview installer and updates
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'kielerdotdev/kielbox'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: kielbox-preview-publication
      cancel-in-progress: false
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download this run's verified installer assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kielbox-windows-x64
          path: installer-assets

      - name: Publish the preview channel
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/installer/Publish-Preview.ps1 -ReleaseDirectory installer-assets -Repository $env:GITHUB_REPOSITORY -ExpectedCommit $env:GITHUB_SHA
